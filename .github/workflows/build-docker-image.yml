name: Build docker image

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download latest GitHub release assets
        id: download_release
        uses: robinraju/release-downloader@v1.10
        with:
          latest: true
          fileName: "cybermp-server-linux-build*"
          # out-file-path: "assets"

      - name: Unzip archive
        run: |
          # 1. Create the target directory
          mkdir -p linux-build

          unzip "cybermp-server-linux-build*" -d linux-build

      - name: Verify files
        run: ls -R linux-build && ls
