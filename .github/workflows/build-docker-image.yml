name: Build docker image

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cyber-mp/server

permissions:
  packages: write
  artifact-metadata: write
  contents: read
  id-token: write
  attestations: write

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download latest GitHub release assets
        id: download_release
        uses: robinraju/release-downloader@v1.10
        with:
          latest: true
          fileName: "cybermp-server-linux-build*"
          # out-file-path: "assets"

      - name: Unzip archive
        run: |
          # 1. Create the target directory
          mkdir -p linux-build

          unzip "cybermp-server-linux-build*" -d linux-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract Metadata and Strip "v" prefix
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Strips the 'v' from the release tag (e.g., v1.0.0 -> 1.0.0)
            type=raw,value=${{ steps.download_release.outputs.tag_name }},enable=true,priority=1000,suffix=,prefix=,strip=v
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Generate Artifact Attestation
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
